name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm test

      - uses: docs/example-action@b16d2601a6b948e2fb26f3772276581f31daa7cd

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
